# Pages CMS sozlamasi (app.pagescms.org). Bu fayl saytdagi hamma matn, video, rasm va fayllarni
# tugmalar orqali tahrirlash imkonini beradi.
media:
  input: media
  output: media

content:
  - name: site
    label: Bosh sahifa
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: eyebrow, label: Ustki kichik yozuv, type: string }
      - { name: title, label: Sarlavha, type: string }
      - { name: lead, label: Qisqa matn, type: text }
      - { name: telegram, label: Telegram username (@ belgisisiz), type: string }
      - { name: price, label: "Kurs narxi (masalan $399)", type: string }
      - { name: priceNote, label: Narx ostidagi izoh, type: string }
      - { name: includes, label: Kurs ichida nima bor (ro'yxat), type: string, list: true }
      - { name: footer, label: Pastki izoh, type: text }
      - { name: updated, label: "Ma'lumotlar yangilangan sana", type: string }
      - { name: heroImage, label: "Bosh sahifa fon rasmi (ixtiyoriy; bo'sh bo'lsa chizilgan Rim manzarasi)", type: image }
      - name: faq
        label: Ko'p beriladigan savollar
        type: object
        list: true
        fields:
          - { name: q, label: Savol, type: string }
          - { name: a, label: Javob, type: text }

  - name: stages
    label: Bosqichlar
    type: file
    path: content/stages.json
    format: json
    list: true
    fields:
      - { name: id, label: "Qisqa kod (lotin harf/raqam, bo'sh joysiz, masalan s8)", type: string, required: true }
      - { name: title, label: Sarlavha, type: string, required: true }
      - { name: sub, label: Qisqa izoh, type: string }
      - { name: free, label: "Bepul bosqich (to'lovsiz ochiq)", type: boolean }
      - name: icon
        label: Belgi
        type: select
        options:
          values: [send, stamp, laptop, passport, coin, plane, cap, home2, doc]
      - { name: when, label: Qachon (sana), type: string }
      - { name: intro, label: Kirish matni, type: text }
      - name: blocks
        label: Bloklar (matn, ro'yxat, video, rasm, fayl...)
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Matn
            fields:
              - { name: title, label: Tugma sarlavhasi, type: string }
              - { name: body, label: Matn (bo'sh qator = yangi xatboshi), type: text }
          - name: list
            label: Ro'yxat
            fields:
              - { name: title, label: Tugma sarlavhasi, type: string }
              - name: style
                label: "Ko'rinishi: steps = raqamli qadamlar, checklist = belgilanadigan hujjatlar, bullets = oddiy ro'yxat"
                type: select
                options:
                  values: [steps, checklist, bullets]
              - { name: items, label: "Qatorlar (checklist'da # bilan boshlangan qator guruh nomi)", type: string, list: true }
          - name: callout
            label: Maslahat / Ogohlantirish
            fields:
              - name: style
                label: "Turi: tip = Uprep maslahati (yashil), warn = ogohlantirish (qizil), info = ma'lumot (ko'k)"
                type: select
                options:
                  values: [tip, warn, info]
              - { name: text, label: Matn, type: text }
          - name: video
            label: Video
            fields:
              - { name: title, label: Sarlavha, type: string }
              - { name: url, label: YouTube yoki Vimeo havolasi, type: string }
              - { name: file, label: Yoki video fayl (kichik mp4), type: file }
              - { name: caption, label: Izoh, type: string }
          - name: image
            label: Rasm
            fields:
              - { name: image, label: Rasm, type: image }
              - { name: caption, label: Izoh, type: string }
          - name: file
            label: Fayl (PDF va boshqalar)
            fields:
              - { name: label, label: Tugma matni, type: string }
              - { name: file, label: Fayl, type: file }
              - { name: note, label: Kichik izoh, type: string }
          - name: button
            label: Havola tugmasi
            fields:
              - { name: label, label: Tugma matni, type: string }
              - { name: url, label: "Havola (https://...)", type: string }
              - { name: note, label: Kichik izoh, type: string }
          - name: stats
            label: Katta raqamlar
            fields:
              - name: items
                label: Raqamlar
                type: object
                list: true
                fields:
                  - { name: big, label: Raqam, type: string }
                  - { name: small, label: Izoh, type: string }
          - name: cards
            label: Taqqoslash kartalari
            fields:
              - name: items
                label: Kartalar
                type: object
                list: true
                fields:
                  - { name: title, label: Sarlavha, type: string }
                  - { name: text, label: Matn, type: text }
      - { name: srcLabel, label: Manba nomi, type: string }
      - { name: srcUrl, label: "Manba havolasi (https://...)", type: string }

  - name: calendar
    label: Kalendar
    type: file
    path: content/calendar.json
    format: json
    list: true
    fields:
      - { name: date, label: Sana, type: string }
      - { name: tag, label: Teg (masalan DiSCo), type: string }
      - { name: text, label: Matn, type: string }

  - name: library
    label: Materiallar
    type: file
    path: content/library.json
    format: json
    list: true
    fields:
      - { name: title, label: Sarlavha, type: string, required: true }
      - { name: desc, label: Qisqa izoh, type: text }
      - name: kind
        label: "Turi: video, file, link yoki image"
        type: select
        options:
          values: [video, file, link, image]
      - { name: url, label: "Havola (YouTube yoki https://...)", type: string }
      - { name: file, label: Fayl yoki video yuklash, type: file }
      - { name: image, label: Muqova rasmi, type: image }

  - name: countries
    label: Davlatlar
    type: file
    path: content/countries.json
    format: json
    list: true
    fields:
      - { name: id, label: "Qisqa kod (masalan italiya)", type: string, required: true }
      - { name: name, label: Nomi, type: string, required: true }
      - { name: code, label: "Ikki harfli kod (IT, DE...)", type: string }
      - name: status
        label: "Holati: open = ochiq, soon = tez orada"
        type: select
        options:
          values: [open, soon]
      - { name: blurb, label: Qisqa izoh, type: string }

  - name: italy
    label: Italiya sahifasi
    type: file
    path: content/italy.json
    format: json
    fields:
      - { name: title, label: Sarlavha, type: string }
      - { name: heroImage, label: "Fon rasmi (ixtiyoriy)", type: image }
      - { name: lead, label: Kirish matni, type: text }
      - name: stats
        label: Katta raqamlar
        type: object
        list: true
        fields:
          - { name: big, label: Raqam, type: string }
          - { name: small, label: Izoh, type: string }
      - name: sections
        label: Bo'limlar
        type: object
        list: true
        fields:
          - { name: id, label: "Qisqa kod (lotin, bo'sh joysiz)", type: string }
          - { name: title, label: Sarlavha, type: string }
          - name: blocks
            label: Bloklar
            type: block
            list: true
            blockKey: type
            blocks:
              - name: text
                label: Matn
                fields:
                  - { name: title, label: Sarlavha, type: string }
                  - { name: body, label: Matn, type: text }
              - name: list
                label: Ro'yxat
                fields:
                  - { name: title, label: Sarlavha, type: string }
                  - name: style
                    label: Ko'rinishi
                    type: select
                    options:
                      values: [steps, checklist, bullets]
                  - { name: items, label: Qatorlar, type: string, list: true }
              - name: callout
                label: Maslahat / Ogohlantirish
                fields:
                  - name: style
                    label: Turi
                    type: select
                    options:
                      values: [tip, warn, info]
                  - { name: text, label: Matn, type: text }
              - name: video
                label: Video
                fields:
                  - { name: title, label: Sarlavha, type: string }
                  - { name: url, label: YouTube havolasi, type: string }
                  - { name: caption, label: Izoh, type: string }
              - name: image
                label: Rasm
                fields:
                  - { name: image, label: Rasm, type: image }
                  - { name: caption, label: Izoh, type: string }
              - name: stats
                label: Katta raqamlar
                fields:
                  - name: items
                    label: Raqamlar
                    type: object
                    list: true
                    fields:
                      - { name: big, label: Raqam, type: string }
                      - { name: small, label: Izoh, type: string }
              - name: cards
                label: Kartalar
                fields:
                  - name: items
                    label: Kartalar
                    type: object
                    list: true
                    fields:
                      - { name: title, label: Sarlavha, type: string }
                      - { name: text, label: Matn, type: text }

  - name: cities
    label: Shaharlar
    type: file
    path: content/cities.json
    format: json
    list: true
    fields:
      - { name: id, label: "Qisqa kod (masalan roma)", type: string, required: true }
      - { name: name, label: Nomi, type: string, required: true }
      - { name: region, label: Viloyat, type: string }
      - { name: dsu, label: Stipendiya idorasi, type: string }
      - { name: intro, label: Kirish matni, type: text }
      - { name: image, label: "Fon rasmi (ixtiyoriy)", type: image }
      - name: links
        label: Foydali rasmiy havolalar
        type: object
        list: true
        fields:
          - { name: label, label: Nomi, type: string }
          - { name: url, label: Havola, type: string }
      - { name: points, label: Muhim faktlar, type: string, list: true }
      - { name: pros, label: "Kuchli tomonlari (Nega shu shahar)", type: string, list: true }
      - { name: cons, label: Bilib qo'ying, type: string, list: true }

  - name: universities
    label: Universitetlar
    type: file
    path: content/universities.json
    format: json
    list: true
    fields:
      - { name: id, label: "Qisqa kod (masalan sapienza)", type: string, required: true }
      - { name: short, label: Qisqa nomi, type: string, required: true }
      - { name: name, label: To'liq nomi, type: string }
      - { name: city, label: "Shahar kodi (roma, milano, torino...)", type: string }
      - name: type
        label: Turi
        type: select
        options:
          values: [Davlat, Xususiy]
      - { name: web, label: "Rasmiy sayt (https://...)", type: string }
      - { name: detailed, label: "To'liq ma'lumotli sahifa", type: boolean }
      - { name: founded, label: Tashkil topgan yili, type: string }
      - { name: rank, label: "Reyting (masalan QS 2027: #111)", type: string }
      - { name: intro, label: Qisqa tavsif, type: text }
      - { name: image, label: "Fon rasmi (ixtiyoriy)", type: image }
      - { name: applyUrl, label: "Ariza sahifasi (xalqaro talabalar uchun, https://...)", type: string }
      - { name: applyNote, label: "Ariza haqida qisqa izoh (masalan: DreamApply portali)", type: string }
      - { name: dsuUrl, label: "Stipendiya sahifasi (faqat universitet o'zi bersa: Lombardiya, Veneto, Kalabriya)", type: string }
      - { name: portalLabel, label: Ariza tugmasi matni, type: string }
      - { name: portalUrl, label: "Ariza / ro'yxatdan o'tish havolasi (https://...)", type: string }
      - { name: fee, label: Ariza to'lovi, type: string }
      - name: deadlines
        label: Muddatlar
        type: object
        list: true
        fields:
          - { name: label, label: "Nima (masalan Bakalavr 2027/28)", type: string }
          - { name: date, label: "Sana (masalan 19.02 – 15.04.2027)", type: string }
      - { name: deadlineNote, label: Muddatlar haqida izoh, type: text }
      - name: levels
        label: Darajalar
        type: object
        list: true
        fields:
          - { name: name, label: "Nomi (Foundation, Bakalavr...)", type: string }
          - { name: duration, label: Davomiyligi, type: string }
          - { name: req, label: Talablar, type: string, list: true }
      - { name: docs, label: Kerakli hujjatlar, type: string, list: true }
      - { name: scholarship, label: Stipendiya, type: text }
      - { name: acceptance, label: Qabul foizi, type: text }
      - { name: tip, label: Uprep maslahati, type: text }
      - { name: video, label: "Ariza videosi (YouTube havolasi)", type: string }
      - { name: programmesUrl, label: "Yo'nalishlar ro'yxati havolasi", type: string }
      - name: programmes
        label: Yo'nalishlar
        type: object
        list: true
        fields:
          - name: level
            label: Daraja
            type: select
            options:
              values: [Bakalavr, Magistratura, Yagona sikl, Foundation]
          - { name: name, label: Nomi, type: string }
          - { name: lang, label: Tili, type: string }
          - { name: req, label: Kim topshira oladi, type: text }
          - { name: gpa, label: "Minimal GPA (100 ballik)", type: string }
          - { name: test, label: Test yoki suhbat, type: string }
      - { name: programmesNote, label: Yo'nalishlar haqida izoh, type: text }
      - { name: infoUrl, label: Xalqaro talabalar sahifasi, type: string }
      - name: sources
        label: Manbalar
        type: object
        list: true
        fields:
          - { name: label, label: Nomi, type: string }
          - { name: url, label: Havola, type: string }

  - name: guide
    label: 0 dan qo'llanma
    type: file
    path: content/guide.json
    format: json
    fields:
      - { name: title, label: Sarlavha, type: string }
      - { name: lead, label: Kirish matni, type: text }
      - name: overview
        label: "3 katta qadam (kartochkalar)"
        type: object
        list: true
        fields:
          - name: icon
            label: Belgi
            type: select
            options:
              values: [send, passport, home2, coin, cap, stamp, laptop, plane, doc]
          - { name: title, label: Sarlavha, type: string }
          - { name: text, label: Matn, type: text }
      - name: timeline
        label: Yo'l xaritasi (qadamlar)
        type: object
        list: true
        fields:
          - { name: when, label: "Qachon (masalan: 10–5 oy oldin)", type: string }
          - { name: title, label: Sarlavha, type: string }
          - { name: text, label: Matn, type: text }
          - { name: stage, label: "Kurs bosqichi kodi (s0...s7, ixtiyoriy)", type: string }
      - name: levels
        label: Qaysi daraja mos
        type: object
        list: true
        fields:
          - { name: title, label: Sarlavha, type: string }
          - { name: text, label: Matn, type: text }
      - name: budget
        label: Xarajatlar
        type: object
        list: true
        fields:
          - { name: item, label: Nima, type: string }
          - { name: cost, label: Summa, type: string }
          - { name: note, label: Izoh, type: text }
      - name: glossary
        label: Lug'at
        type: object
        list: true
        fields:
          - { name: term, label: Atama, type: string }
          - { name: def, label: Ma'nosi, type: text }
      - { name: mistakes, label: Ko'p uchraydigan xatolar, type: string, list: true }
      - name: sources
        label: Manbalar
        type: object
        list: true
        fields:
          - { name: label, label: Nomi, type: string }
          - { name: url, label: Havola, type: string }

  - name: dsu
    label: Stipendiyalar (viloyatlar)
    type: file
    path: content/dsu.json
    format: json
    fields:
      - name: national
        label: Davlat minimumlari
        type: object
        fields:
          - { name: year, label: O'quv yili, type: string }
          - { name: fuoriSede, label: Fuori sede summasi, type: string }
          - { name: pendolare, label: Pendolare summasi, type: string }
          - { name: inSede, label: In sede summasi, type: string }
          - { name: isee, label: ISEE chegarasi, type: string }
          - { name: ispe, label: ISPE chegarasi, type: string }
          - { name: source, label: Manba nomi, type: string }
          - { name: sourceUrl, label: Manba havolasi, type: string }
      - name: agencies
        label: Idoralar
        type: object
        list: true
        fields:
          - { name: id, label: Kod, type: string }
          - { name: name, label: Nomi, type: string }
          - { name: region, label: Viloyat, type: string }
          - { name: cities, label: "Shahar kodlari (roma, milano...)", type: string, list: true }
          - { name: url, label: Sayt, type: string }
          - { name: deadline, label: Ariza muddati, type: string }
          - { name: amount, label: "Maksimal summa (bo'sh = davlat minimumi)", type: string }
          - { name: note, label: Izoh, type: text }
          - { name: own, label: "Stipendiyani universitetning o'zi beradi", type: boolean }
      - name: uniScholarships
        label: Universitetlarning o'z stipendiyalari
        type: object
        list: true
        fields:
          - { name: uni, label: "Universitet kodi (masalan unical)", type: string }
          - { name: title, label: Sarlavha, type: string }
          - { name: text, label: Matn, type: text }
          - { name: url, label: Rasmiy havola, type: string }

  - name: news
    label: Yangiliklar
    type: file
    path: content/news.json
    format: json
    list: true
    fields:
      - { name: date, label: "Sana (masalan 26.11.2026)", type: string }
      - { name: tag, label: "Belgi (Viza, 2027/28, Stipendiya...)", type: string }
      - { name: title, label: Sarlavha, type: string }
      - { name: text, label: Matn, type: text }
      - { name: link, label: "Havola (#uni-polimi yoki https://...)", type: string }

  - name: living
    label: Italiyada yashash
    type: file
    path: content/living.json
    format: json
    fields:
      - { name: title, label: Sarlavha, type: string }
      - { name: lead, label: Kirish matni, type: text }
      - name: sections
        label: Bo'limlar
        type: object
        list: true
        fields:
          - { name: id, label: Kod, type: string }
          - name: icon
            label: Belgi
            type: select
            options:
              values: [home2, shield, doc, heart, briefcase, stop, cal, coin, plane, train]
          - { name: title, label: Sarlavha, type: string }
          - { name: intro, label: Kirish, type: text }
          - { name: items, label: Bandlar, type: string, list: true }
      - name: sources
        label: Manbalar
        type: object
        list: true
        fields:
          - { name: label, label: Nomi, type: string }
          - { name: url, label: Havola, type: string }

  - name: reviews
    label: Fikrlar (faqat haqiqiy, roziligi bilan)
    type: file
    path: content/reviews.json
    format: json
    list: true
    fields:
      - { name: name, label: "Ism (masalan Aziza R.)", type: string, required: true }
      - { name: uni, label: "Universitet kodi (masalan polimi)", type: string }
      - { name: program, label: Dastur, type: string }
      - { name: year, label: "Yil (masalan 2026)", type: string }
      - { name: photo, label: Rasm (ixtiyoriy), type: image }
      - { name: text, label: Fikr, type: text, required: true }
      - { name: consent, label: "Talaba e'lon qilishga yozma rozilik berdi", type: boolean }

  - name: about
    label: "Biz haqimizda"
    type: file
    path: content/about.json
    format: json
    fields:
      - { name: title, label: Sarlavha, type: string }
      - { name: lead, label: "Qisqa kirish matni (sarlavha ostida)", type: text }
      - { name: name, label: "Ismingiz (bo'sh bo'lsa, shaxsiy karta chiqmaydi)", type: string }
      - { name: role, label: "Kimsiz (masalan: Uprep asoschisi, Sapienza talabasi)", type: string }
      - { name: photo, label: "Rasmingiz (kvadrat rasm yaxshi chiqadi)", type: image }
      - { name: bio, label: "O'zingiz haqingizda (bo'sh qator = yangi xatboshi)", type: text }
      - name: story
        label: "Bizning yo'limiz (yillar bo'yicha)"
        type: object
        list: true
        fields:
          - { name: year, label: "Yil (masalan 2024)", type: string }
          - { name: title, label: Sarlavha, type: string }
          - { name: text, label: Matn, type: text }
      - name: stats
        label: "Raqamlar (faqat haqiqiy: masalan 35 / talaba Italiyaga ketdi)"
        type: object
        list: true
        fields:
          - { name: big, label: Raqam, type: string }
          - { name: small, label: Izoh, type: string }
      - { name: video, label: "Tanishuv videosi (YouTube havolasi, ixtiyoriy)", type: string }
      - name: gallery
        label: "Suratlar galereyasi"
        type: object
        list: true
        fields:
          - { name: image, label: Rasm, type: image }
          - { name: caption, label: "Izoh (ixtiyoriy)", type: string }
      - { name: services, label: "Nimada yordam beramiz (ro'yxat)", type: string, list: true }
      - name: principles
        label: "Qanday ishlaymiz (tamoyillar)"
        type: object
        list: true
        fields:
          - { name: t, label: Sarlavha, type: string }
          - { name: d, label: Matn, type: text }
      - name: links
        label: "Boshqa havolalar (Telegram kanal, Instagram, YouTube...)"
        type: object
        list: true
        fields:
          - { name: label, label: "Tugma matni", type: string }
          - { name: url, label: "Havola (https://...)", type: string }

  - name: noldan
    label: "Noldan: to'liq yo'riqnoma"
    type: file
    path: content/noldan.json
    format: json
    fields:
      - { name: title, label: Sarlavha, type: string }
      - { name: subtitle, label: "Kichik sarlavha", type: string }
      - { name: updated, label: "Ma'lumotlar sanasi (masalan 26.11.2026)", type: string }
      - { name: letter, label: "Kirish maktubi (bo'sh qator = yangi xatboshi)", type: text }
      - name: summary
        label: "Bir qarashda (qisqa qadamlar)"
        type: object
        list: true
        fields:
          - { name: n, label: Raqam, type: string }
          - { name: t, label: Sarlavha, type: string }
          - { name: d, label: Izoh, type: string }
      - name: chapters
        label: Boblar
        type: object
        list: true
        fields:
          - { name: id, label: "Qisqa kod (lotin harf, bo'sh joysiz)", type: string, required: true }
          - { name: kicker, label: "Ustki yozuv (masalan 3-bob)", type: string }
          - { name: title, label: Sarlavha, type: string, required: true }
          - { name: when, label: Qachon, type: string }
          - { name: body, label: "Matn (bo'sh qator = yangi xatboshi)", type: text }
          - { name: steps, label: "Nima qilasiz (qadamlar)", type: string, list: true }
          - name: sections
            label: "Qo'shimcha ro'yxatlar"
            type: object
            list: true
            fields:
              - { name: title, label: Sarlavha, type: string }
              - { name: items, label: Qatorlar, type: string, list: true }
          - { name: tip, label: "Uprep maslahati", type: text }

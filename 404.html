<script>
/* GitHub Pages shows this for unknown paths: send the visitor to the site's own "page not found" view (or the right page) */
(function(){
  var p = location.pathname, base = p.indexOf("/uprep-site/") === 0 ? "/uprep-site/" : "/";
  var rest = p.slice(base.length).replace(/\/+$/, "").replace(/\.html?$/, "");
  location.replace(base + (rest ? "#" + rest.replace(/\//g, "-") : ""));
})();
</script>

<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F4FA;color:#14122E;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{color:#4535C4;font-weight:700}</style>
<script>
/* GitHub Pages shows this for unknown paths: send the visitor to the site's own "page not found" view (or the right page) */
(function(){
  /* on github.io the site lives under /<repository>/, on its own domain at / */
  var p = location.pathname, m = p.match(/^\/[^/]+\//), base = /github\.io$/.test(location.hostname) && m ? m[0] : "/";
  var rest = p.slice(base.length).replace(/\/+$/, "").replace(/\.html?$/, "");
  location.replace(base + (rest ? "#" + rest.replace(/\//g, "-") : ""));
})();
</script>
</head>
<body><p>Sahifa topilmadi. <a href="/">Bosh sahifaga o'tish</a></p></body>

# Optional: deploy from the command line with `npx wrangler deploy` (inside this folder).
# The Cloudflare dashboard way (copy-paste worker.js) works too and needs no tools.
# Secrets are NEVER written here. Add them with:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID
#   npx wrangler secret put APP_KEY
name = "uniroad-feedback"
main = "worker.js"
compatibility_date = "2025-06-01"

# ALLOWED_ORIGINS defaults to the Uniroad site inside worker.js; set it only to allow other sites ("*" = any).
[vars]
TIME_ZONE = "Asia/Tashkent"
